{% extends 'base.html' %}
{% block title %} Reports {% endblock %}


{% block content %}
<div class="container-fluid px-4 py-3 text-start">
    
    <div class="mb-5">
        <h1 class="text-dark fw-bold h3">Reports</h1>
        <p class="text-muted small">Generate a weekly summary of your activities powered by AI.</p>
    </div>

    <div class="mb-5">
        <form method="POST" action="{% url 'week_summarize' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-md btn-primary px-4 py-2.5 text-uppercase fw-bold rounded-3 shadow-sm d-flex align-items-center gap-2">
                <i class="bi bi-lightning-charge-fill text-warning"></i> Generate Summary
            </button>
        </form>
    </div>

    {% if resume %}
    <div class="row">
        <div class="col-12 col-xl-8">
            <div class="mb-3">
                <h3 class="text-dark fw-bold h5 mb-3">AI Summary</h3>
                
                    <div class="card shadow-sm border-light bg-white rounded-3 p-4">
                        <div class="card-body p-0">
                            <p class="card-text text-secondary lh-lg" style="white-space: pre-line; font-size: 0.95rem;">
                                {{ resume }}
                            </p>
                        </div>
                    </div>
            </div>
        </div>
    </div>
    {% endif %}

</div>
{% endblock %}
