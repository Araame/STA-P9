{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="text-dark fw-bold">My Notes</h1>
        <a href="{%url 'add'%}" class="btn btn-primary btn border-radius-20"><i class="bi bi-plus"></i>NEW NOTE</a>
    </div>
    <div class="row">
    
    </div>
{% for note in notes %}
<p>{{note.title}}</p>
<a href="{% url 'modify' note.id %}">Modify</a>
<a href="{% url 'delete' note.id %}">Delete</a>

{%endfor%}
{% endblock %}
