<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <title>Dashboard</title>
  <style>
    @media (min-width: 768px) {
      .sidebar-fixed {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 16.666667%; /* Correspond à col-md-2 */
        z-index: 1030;
      }
      .main-content {
        margin-left: 16.666667%; /* Laisse la place pour la sidebar */
      }
    }
  </style>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-12 col-md-2 bg-white border-end sidebar-fixed p-0 d-flex flex-column justify-content-between">
                
                <div class="w-100">
                    <div class="p-3 d-flex justify-content-between align-items-center border-bottom border-md-0">
                        <h4 class="text-primary fw-bold mb-0">TrackNote</h4>
                        <button class="btn d-md-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
                            <i class="bi bi-list fs-3"></i>
                        </button>
                    </div>

                    <div class="collapse d-md-block" id="sidebarMenu">
                        <ul class="nav flex-column p-3 pt-2">
                            
                            <li class="nav-item mb-2">
                                <a href="{% url 'home' %}" class="nav-link rounded {% if request.resolver_match.url_name == 'home' %}bg-primary text-white shadow-sm{% else %}text-dark{% endif %}">
                                    <i class="bi bi-grid me-2"></i> Dashboard
                                </a>
                            </li>

                            {% if user.is_staff %}
                            <li class="nav-item mb-2">
                                <a href="{% url 'all_notes' %}" class="nav-link rounded {% if request.resolver_match.url_name == 'all_notes' %}bg-primary text-white shadow-sm{% else %}text-dark{% endif %}">
                                    <i class="bi bi-folder2-open me-2"></i> All Notes
                                </a>
                            </li>
                            {% endif %}

                            <li class="nav-item mb-2">
                                <a href="{% url 'list_notes' %}" class="nav-link rounded {% if request.resolver_match.url_name in 'list_notes add modify detail delete' %}bg-primary text-white shadow-sm{% else %}text-dark{% endif %}">
                                    <i class="bi bi-journal-text me-2"></i> My Notes
                                </a>
                            </li>

                            <li class="nav-item mb-2">
                                <a href="{% url 'week_summarize' %}" class="nav-link rounded {% if request.resolver_match.url_name == 'week_summarize' %}bg-primary text-white shadow-sm{% else %}text-dark{% endif %}">
                                    <i class="bi bi-bar-chart-line me-2"></i> Reports
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="collapse d-md-block w-100 border-top mt-auto" id="sidebarMenuProfile">
                    <div class="p-3 bg-light d-flex flex-column gap-2">
                        <div class="d-flex align-items-center mb-1">
                            <img src="https://i.pravatar.cc/40" class="rounded-circle me-2 border" width="36" height="36">
                            <div class="overflow-hidden">
                                <span class="fw-semibold d-block text-truncate small text-dark">{{ user.username|capfirst }}</span>
                            </div>
                        </div>
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button class="btn btn-sm btn-outline-danger w-100 text-start d-flex align-items-center justify-content-center gap-2"" type="submit">Déconnexion</button>
                        </form>
                    </div>
                </div>

            </nav>

            <main class="col-12 col-md-10 p-0 main-content">
                <div class="p-4 pt-5 pt-md-4">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
