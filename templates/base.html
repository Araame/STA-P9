<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <title>Dashboard</title>
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <div class="col-md-2 bg-white border-end vh-100 p-0">

                <div class="p-3">
                    <h4 class="text-primary fw-bold">TrackNote</h4>
                </div>

                <ul class="nav flex-column p-3">

                    <li class="nav-item mb-2">
                        <a href="{% url 'home' %}" class="nav-link bg-primary text-white rounded">
                            <i class="bi bi-grid me-2"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="{% url 'list_notes' %}" class="nav-link text-dark">
                            <i class="bi bi-journal-text me-2"></i>
                            My Notes
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-tags me-2"></i>
                            Categories
                        </a>
                    </li>

                    <li class="nav-item mb-2">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-bar-chart me-2"></i>
                            Reports
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-gear me-2"></i>
                            Settings
                        </a>
                    </li>
                </ul>
            </div>

            <div class="col-md-10 p-0">
            <!-- TOPBAR -->
                <nav class="navbar navbar-expand-lg bg-white border-bottom px-4 py-3">

                    <div class="container-fluid">

                        <!-- Search -->
                        <form class="d-flex w-50">
                            <div class="input-group">

                                <span class="input-group-text bg-light border-0">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input class="form-control border-0 bg-light" type="search" placeholder="Search...">

                            </div>
                        </form>

                        <!-- Right -->
                        <div class="d-flex align-items-center gap-4">

                            <div class="position-relative">
                                <i class="bi bi-bell fs-5"></i>
                            </div>

                            <div class="d-flex align-items-center">
                                <img src="https://i.pravatar.cc/40" class="rounded-circle me-2" width="40" height="40">
                                <span class="fw-semibold">{{user.username | capfirst}}</span>
                            </div>
                        </div>
                    </div>
                </nav>

                <!-- CONTENT -->
                <div class="p-4">
                    {% block content %}

                    {% endblock %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
